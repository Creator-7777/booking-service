<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Elena Nail Studio</title>
    <meta name="theme-color" content="#7d4cff">
    <meta name="description"
            content="Online booking for manicure and pedicure">
    <link rel="stylesheet" href="booking.css">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>
<div class="page">
    <div class="booking-card">

        <!-- ========================= -->
        <!-- Logo                      -->
        <!-- ========================= -->

        <div class="logo-wrapper">
            <img
                    class="logo"
                    src="https://i.imgur.com/SGjW8gC.jpeg"
                    alt="Elena Nail Studio">
        </div>

        <!-- ========================= -->
        <!-- Social / Language / Location -->
        <!-- ========================= -->

        <div class="quick-actions">
            <!-- ========================= -->
            <!-- Language selector         -->
            <!-- ========================= -->
            <div class="language-selector">
                <button
                        id="languageBtn"
                        class="language-btn"
                        type="button">
                    🌍
                </button>
                <div id="languageMenu"
                     class="language-menu hidden">
                    <button data-lang="ru">RU Русский </button>
                    <button data-lang="en">GB English</button>
                    <button data-lang="he">IL עברית</button>
                </div>
            </div>
            <!-- ========================= -->
            <!-- Instagram                 -->
            <!-- ========================= -->
            <div class="socials">
                <a href="https://www.instagram.com/elenanail.rlz?igsh=MTdxcTYza3BtYXRseg=="
                   target="_blank">
                    <img
                            src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"
                            alt="Instagram">
                </a>
            </div>
            <!-- ========================= -->
            <!-- GEO Location        -->
            <!-- ========================= -->
            <div class="location-container">
                <a
                        class="location-btn"
                        href="https://www.google.com/maps/search/?api=1&query=31.9612775,34.8001301"
                        target="_blank"
                        rel="noopener"
                        aria-label="Open Elena Nail Studio in Google Maps">
                        <img src="images/google-maps-icon.svg" alt="Google Maps">
                    <!--📍--><!-- <span data-i18n="location">Herzel 102</span>-->
                </a>
            </div>
            <!-- ========================= -->
            <!-- Waze                      -->
            <!-- ========================= -->
            <div class="waze-container">
                <a
                        class="waze-btn"
                        href="https://waze.com/ul?ll=31.9612775,34.8001301&navigate=yes"
                        target="_blank"
                        rel="noopener"
                        aria-label="Navigate to Elena Nail Studio with Waze">
                    <img src="images/waze-icon.svg" alt="Waze">
                    <!--<span class="waze-icon">🚙</span>-->

                </a>
            </div>
        </div>

        <!-- ========================= -->
        <!-- Header                    -->
        <!-- ========================= -->

        <h1>Elena Nail Studio</h1>
        <p class="subtitle" data-i18n="subtitle"> Онлайн запись </p>

        <!-- ========================= -->
        <!-- Master Works Gallery      -->
        <!-- ========================= -->
        <section
                id="works-section"
                class="works-section">
            <div class="works-header">
                <h2 data-i18n="masterWorks">
                    Работы мастера
                </h2>
                <p data-i18n="masterWorksSubtitle">
                    Последние работы
                </p>
            </div>
            <div class="gallery">
                <!-- Main image -->
                <div class="gallery-main">
                    <img
                            id="galleryMainImage"
                            src=""
                            alt="Master work">

                    <button
                            type="button"
                            id="galleryPrev"
                            class="gallery-arrow gallery-prev">
                        ‹
                    </button>
                    <button
                            type="button"
                            id="galleryNext"
                            class="gallery-arrow gallery-next">
                        ›
                    </button>
                    <div
                            id="galleryCounter"
                            class="gallery-counter">
                        1 / 12
                    </div>
                </div>
                <!-- Thumbnails -->
                <div
                        id="galleryThumbnails"
                        class="gallery-thumbnails">
                </div>
            </div>
        </section>

        <!-- ========================= -->
        <!-- Booking Form              -->
        <!-- ========================= -->

        <div id="booking-section">
            <form id="form">
                <!-- Name -->
                <div class="field">
                    <label
                            for="name"
                            data-i18n="name">
                        Name
                    </label>
                    <input
                            id="name"
                            name="name"
                            type="text"
                            required
                            data-i18n-placeholder="namePlaceholder"
                            placeholder="Your name">
                </div>
                <!-- Phone -->
                <div class="field">
                    <label
                            for="phone"
                            data-i18n="phone">
                        Phone
                    </label>

                    <input
                            id="phone"
                            name="phone"
                            type="tel"
                            required
                            pattern="^05\d\d{7}$"
                            placeholder="05XXXXXXXX"
                            data-i18n-placeholder="phonePlaceholder">
                    <span
                            id="phone-error"
                            class="error-message"
                            style="display:none"
                            data-i18n="phoneInvalid">
                        Invalid phone number
                    </span>
                </div>

                <!-- Send SMS -->
                <button
                        id="sendCodeBtn"
                        type="button"
                        class="secondary"
                        data-i18n="sendCode">
                    Send SMS Code
                </button>
                <!-- Verification -->
                <div
                        id="codeSection"
                        class="hidden">
                    <label
                            for="codeInput"
                            data-i18n="verifyCode">
                        Verification Code
                    </label>
                    <input
                            id="codeInput"
                            type="text"
                            autocomplete="one-time-code"
                            data-i18n-placeholder="verifyCodePlaceholder"
                            placeholder="Enter SMS Code">
                </div>

                <!-- ========================= -->
                <!-- Services                  -->
                <!-- ========================= -->

                <div class="field" id="prices-section">
                    <label
                            for="service"
                            data-i18n="service">
                        Services
                    </label>

                    <select
                            id="service"
                            name="service"
                            multiple
                            required>
                    </select>

                </div>

                <!-- ========================= -->
                <!-- Date                      -->
                <!-- ========================= -->

                <div class="field">
                    <label
                            for="date"
                            data-i18n="date">
                        Date
                    </label>

                    <input
                            id="date"
                            name="date"
                            type="date"
                            required>

                </div>

                <!-- ========================= -->
                <!-- Time                      -->
                <!-- ========================= -->

                <div class="field">
                    <label
                            for="time"
                            data-i18n="time">
                        Time
                    </label>

                    <select
                            id="time"
                            name="time"
                            required>
                        <option value=""
                                data-i18n="chooseTime">
                            Choose time
                        </option>
                    </select>
                </div>

                <!-- ========================= -->
                <!-- Submit                    -->
                <!-- ========================= -->

                <button
                        id="submitBtn"
                        class="primary"
                        type="submit"
                        data-i18n="submit">
                    Book Now
                </button>
            </form>
        </div>

        <!-- ========================= -->
        <!-- Status                    -->
        <!-- ========================= -->

        <div id="status" class="status"> </div>

        <!-- ========================= -->
        <!-- Cabinet                   -->
        <!-- ========================= -->

        <div id="cabinetWindow" class="cabinet hidden">
            <div class="cabinet-header">
                <h2 data-i18n="myCabinet">
                    Мои записи
                </h2>
                <button id="closeCabinet"
                        class="close-Cabinet"
                        type="button">
                    ✕
                </button>
            </div>
            <div id="cabinetContent">
            </div>
        </div>

        <!-- ========================= -->
        <!-- No slots                  -->
        <!-- ========================= -->

        <div
                id="no-slots"
                class="warning hidden"
                data-i18n="noSlots">
            No available time slots
        </div>

    </div>

    <!-- ========================= -->
    <!-- Mobile Bottom Navigation -->
    <!-- ========================= -->

    <nav class="mobile-bottom-nav" id="mobileBottomNav">

        <button
                type="button"
                class="mobile-nav-item active"
                data-target="top">
            <span class="nav-icon">⌂</span>
            <span class="nav-label" data-i18n="home">
            Главная
        </span>
        </button>

        <button
                type="button"
                class="mobile-nav-item"
                data-target="booking">
            <span class="nav-icon">📅</span>
            <span class="nav-label" data-i18n="booking">
            Запись
        </span>
        </button>

        <button
                type="button"
                class="mobile-nav-item"
                data-target="prices">
            <span class="nav-icon">🏷</span>
            <span class="nav-label" data-i18n="prices">
            Цены
        </span>
        </button>

        <button
                type="button"
                class="mobile-nav-item"
                data-target="cabinet">
            <span class="nav-icon">☰</span>
            <span class="nav-label" data-i18n="myCabinet">
            Мои записи
        </span>
        </button>

    </nav>

    <footer>
        <p>
            © 2026 Elena Nail Studio Herzel st. 102
        </p>
    </footer>
</div>

<!--<script src="js/script.js"></script>-->

<!--the order is important-->
<script src="js/utils.js"></script>
<script src="js/language.js"></script>
<script src="js/calendar.js"></script>
<script src="js/sms.js"></script>
<script src="js/booking.js"></script>
<script src="js/app.js"></script>
<script src="js/mobile-navigation.js"></script>
<script src="js/gallery.js"></script>

</body>
</html>
