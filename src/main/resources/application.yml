spring:

  ADMIN_USERNAME: ${ADMIN_USERNAME}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}

  messages:
    basename: i18n/messages
    encoding: UTF-8

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    datasource:
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update


  jackson:
    time-zone: Asia/Jerusalem

  flyway:
    enabled: true
    baseline-on-migrate: true

