google:
  apps-script-url: ${GOOGLE_APPS_SCRIPT_URL}
  calendar-id: ${GOOGLE_CALENDAR_ID}
  #credentials-json: "${app.config.google-service-account-json}"
  credentials-json: ${GOOGLE_SERVICE_ACCOUNT_JSON}
  sheet.id: ${GOOGLE_SHEET_ID}
  bookings-sheet-id: ${BOOKING_SHEET_ID}
  booking-sheet-old-id: ${BOOKING_SHEET_OLD_ID}


sms:
  api-key: ${SMS_API_KEY}
  user: ${SMS_USER}
  password: ${SMS_PASSWORD}
  sender: ${SMS_SENDER}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

  # =========================
  # RAM optimization
  # =========================
  # Tomcat HTTP threads
  tomcat:
    keep-alive-timeout: 10000 # Чтобы старые соединения не занимали слоты (10 секунд).
    threads:
      max: 10                 # 10 потоков хватит с большим запасом и займет всего ~10 МБ RAM
      min-spare: 2            # держим минимум потоков, чтобы не тратить ресурсы зря
      max-connections: 20     # Браузеры держат много Keep-Alive соединений; 100 слотов почти не едят RAM (NIO), но спасают от блокировок
      accept-count: 5         # Уменьшаем очередь ожидания в ОС, чтобы не копились тяжелые запросы
      compression:
        enabled: true         # Если перед приложением НЕТ Nginx, лучше включить сжатие — это сильно ускорит загрузку фронтенда и JSON




